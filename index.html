<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>reCAPTCHA v3 score probe</title>
<script src="https://www.google.com/recaptcha/enterprise.js?render=6LeHciEuAAAAAJSL9I_rLsgkmxdwe5IL27QfR_dv"></script>
<style>
  body { font: 16px/1.5 system-ui, sans-serif; max-width: 40rem; margin: 3rem auto; padding: 0 1rem; }
  output { display: block; word-break: break-all; font: 12px ui-monospace, monospace; }
</style>
</head>
<body>
<h1>reCAPTCHA v3 score probe</h1>
<p>A test page for measuring how a browser scores with reCAPTCHA v3. It requests a token on load and again on each
click; the token is written below for a separate tool to assess. It collects nothing else.</p>
<label>Some text <input id="text" type="text" autocomplete="off"></label>
<p><button id="run" type="button">Request a new token</button></p>
<p>Status: <span id="status">waiting</span></p>
<output id="token" data-action="" data-at=""></output>
<script>
  const SITE_KEY = '6LeHciEuAAAAAJSL9I_rLsgkmxdwe5IL27QfR_dv';
  const action = new URLSearchParams(location.search).get('action') || 'probe';

  async function requestToken() {
    const status = document.getElementById('status');
    const out = document.getElementById('token');
    status.textContent = 'requesting';
    try {
      const token = await grecaptcha.enterprise.execute(SITE_KEY, { action });
      out.textContent = token;
      out.dataset.action = action;
      out.dataset.at = new Date().toISOString();
      status.textContent = 'ready';
    } catch (error) {
      status.textContent = 'error: ' + error;
    }
  }

  grecaptcha.enterprise.ready(requestToken);
  document.getElementById('run').addEventListener('click', requestToken);
</script>
</body>
</html>
